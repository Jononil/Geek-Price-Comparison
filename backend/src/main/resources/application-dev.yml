# ============================================================
# 本地开发环境配置（Spring Profile: dev）
# ------------------------------------------------------------
# 背景：本机 3306 被 phpStudy 的 MySQL 5.5 占用，且系统服务
#       "MySQL" 指向的也是 5.5（Stopped）。项目需要 MySQL 8.x，
#       因此本地另起一个独立 8.4 实例跑在 3307，数据目录：
#       %LOCALAPPDATA%\GeekPrice\mysql-data
#
# 启动方式：
#   java -jar geek-price-backend.jar --spring.profiles.active=dev
#   或 scripts/dev-start.ps1 一键拉起（推荐）
#
# 注意：此 profile 只覆盖数据源地址，账号密码仍沿用
#       application.yml 中的 root / 123456。
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/geek_price?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
